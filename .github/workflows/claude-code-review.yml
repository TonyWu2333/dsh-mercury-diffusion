name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels the review still running for the previous commit
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request using the whole repository as context. The working
            directory is a checkout of the PR merged into its base branch.

            1. Read the PR title, description and diff (`gh pr view`, `gh pr diff`).
            2. Read CLAUDE.md and README.md if present to learn the project's conventions.
            3. For every changed or removed symbol (exported function, type, constant,
               config/schema key, CLI flag, route), search the repository for all of its
               usages and read them. Check whether the change breaks or silently alters
               behavior anywhere else: call sites, client code, tests, build scripts,
               cordis.patch.yml, package.json exports, and docs that describe the behavior.
            4. Check the changed code itself for bugs, type errors, unhandled edge cases,
               resource leaks and security problems.

            Only report issues you have verified by reading the relevant code and are
            confident are real. Do not report style preferences, nitpicks, or problems that
            already existed before this PR and are not made worse by it.

            Post each issue as an inline comment on the relevant diff line with
            mcp__github_inline_comment__create_inline_comment (confirmed: true). When an issue
            is caused by code outside the diff, anchor it on the changed line that triggers it
            and link the affected location as
            https://github.com/${{ github.repository }}/blob/<HEAD SHA>/<path>#L<start>-L<end>.
            Include a suggestion block only when applying it fully fixes the issue.

            Finally post one summary comment with `gh pr comment`, headed
            "## Code review (${{ github.event.pull_request.head.sha }})", listing the issues
            found, or "No issues found." followed by one line on which other parts of the
            repository you checked for impact.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
